{% extends "base.html" %}
{% block contenido %}
<header class="cabecera">
  <div class="cabecera-izq">
    <h1>{{ titulo }}</h1>
    {% include "_nav.html" %}
    <span class="etiqueta-version">v{{ version }}</span>
    <span id="estado-refresco" class="estado-refresco">Cargando…</span>
  </div>
  <div class="cabecera-der">
    <button id="btn-refrescar" class="boton secundario" type="button">Refrescar</button>
    <button id="btn-media" class="boton secundario" type="button"
            title="Recalcula el tamaño de las carpetas media (puede tardar varios minutos)">Recalcular media</button>
    <button id="btn-excel" class="boton secundario" type="button">Excel</button>
    <button id="btn-csv" class="boton secundario" type="button">CSV</button>
    <button id="btn-tareas" class="boton secundario" type="button">Tareas</button>
    <button id="btn-historial" class="boton secundario" type="button">Historial</button>
    {% if auth_activa %}<a class="boton secundario" href="/logout">Salir</a>{% endif %}
  </div>
</header>

<div id="avisos"></div>

<section class="tarjetas" id="tarjetas"></section>

<section class="barra">
  <input type="search" id="filtro-texto" placeholder="Buscar por cliente, empresa, dominio, ruta, servicio o base…">
  <select id="filtro-tipo" title="Sistema">
    <option value="">Todos los sistemas</option>
    <option value="inventario">Inventario</option>
    <option value="restaurante">Restaurante</option>
  </select>
  <select id="filtro-estado" title="Estado">
    <option value="">Todos los estados</option>
    <option value="ok">Sin novedades</option>
    <option value="alerta">Con alerta</option>
    <option value="error">Caídos</option>
    <option value="db-caida">Base caída</option>
    <option value="sitio-desactivado">Sitio Apache desactivado</option>
    <option value="ssl-problema">SSL vencido / por vencer / autofirmado</option>
    <option value="url-caida">URL no responde</option>
    <option value="dominio-viejo">Dominio desactualizado</option>
    <option value="dominio-compartido">Dominio compartido (template)</option>
    <option value="sin-ruc-proveedor">Sin RUC facturador</option>
    <option value="sin-columna-ruc">Sin el campo rucproveedor (falta migrar)</option>
    <option value="sin-facturar">Dejó de facturar</option>
    <option value="api-activa">Búsqueda por cédula activa</option>
    <option value="api-inactiva">Búsqueda por cédula inactiva</option>
  </select>
  <select id="filtro-ocultos" title="Instancias ocultas (excluidos.txt)" hidden>
    <option value="">Ocultas: todas</option>
    <option value="no">Sólo las visibles</option>
    <option value="si">Sólo las ocultas</option>
  </select>
  <select id="filtro-servicio" title="Estado del servicio">
    <option value="">Servicio: todos</option>
    <option value="activo">Activo</option>
    <option value="inactivo">Inactivo</option>
    <option value="fallido">Fallido</option>
    <option value="sin-unidad">Sin unidad</option>
    <option value="socket">Parado pero con socket escuchando</option>
  </select>
  <select id="filtro-uso" title="Tiempo sin actividad">
    <option value="">Actividad: todas</option>
    <option value="30">Sin uso &gt; 30 días</option>
    <option value="60">Sin uso &gt; 60 días</option>
    <option value="90">Sin uso &gt; 90 días</option>
    <option value="180">Sin uso &gt; 180 días</option>
    <option value="365">Sin uso &gt; 1 año</option>
  </select>
  <select id="filtro-api" title="Búsqueda de cédula por API">
    <option value="">API cédula: todas</option>
    <option value="si">Con API activa</option>
    <option value="no">Con API desactivada</option>
    <option value="nd">Sin esa opción</option>
  </select>
  <select id="orden" title="Ordenar por"></select>
  <button id="btn-orden-dir" class="boton mini" type="button" title="Invertir orden">▲</button>
  <div class="menu">
    <button id="btn-columnas" class="boton mini" type="button">Columnas ▾</button>
    <div class="menu-caja oculto" id="menu-columnas"></div>
  </div>
  <label class="check"><input type="checkbox" id="auto-refresco" checked> Auto</label>
  <span class="crece"></span>
  <span id="contador" class="tenue"></span>
</section>

<div class="tabla-envoltura">
  <table class="tabla" id="tabla">
    <thead>
      <tr id="fila-grupos"></tr>
      <tr id="fila-cabecera"></tr>
    </thead>
    <tbody id="cuerpo-tabla">
      <tr><td class="vacio">Cargando instancias…</td></tr>
    </tbody>
  </table>
</div>

<footer class="pie"><span id="pie-info"></span></footer>

<div class="modal oculto" id="modal-tarea">
  <div class="modal-caja">
    <div class="modal-cabecera">
      <h2 id="tarea-titulo"></h2>
      <button class="cerrar" id="tarea-cerrar" type="button">&times;</button>
    </div>
    <div class="modal-cuerpo" id="tarea-cuerpo"></div>
  </div>
</div>

<div class="modal oculto" id="modal-nueva">
  <div class="modal-caja">
    <div class="modal-cabecera">
      <h2>Nueva instancia</h2>
      <button class="cerrar" id="nueva-cerrar" type="button">&times;</button>
    </div>
    <div class="modal-cuerpo" id="nueva-cuerpo"></div>
  </div>
</div>

<div class="modal oculto" id="modal">
  <div class="modal-caja">
    <div class="modal-cabecera">
      <h2 id="modal-titulo"></h2>
      <button class="cerrar" id="modal-cerrar" type="button">&times;</button>
    </div>
    <div class="modal-cuerpo" id="modal-cuerpo"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>window.PANEL_INTERVALO = {{ intervalo }};</script>
<script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
{% endblock %}
